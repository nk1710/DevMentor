<!DOCTYPE html>
<html>
<head>
    <title>DevMentor API - Error</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #080B1A;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container { text-align: center; padding: 2rem; }
        .code { font-size: 5rem; font-weight: 800; color: #6366f1; margin-bottom: 1rem; }
        .message { font-size: 1.25rem; color: #94a3b8; margin-bottom: 2rem; }
        .detail { font-size: 0.875rem; color: #64748b; }
        a { color: #6366f1; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">Error</div>
        <div class="message">DevMentor API encountered an issue</div>
        <div class="detail">
            <p>Status: {{status}}</p>
            <p>Path: {{path}}</p>
            <p><a href="/">Back to Home</a></p>
        </div>
    </div>
</body>
</html>
