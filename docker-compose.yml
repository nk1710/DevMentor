version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: project_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: devmentor
      MYSQL_USER: devmentor
      MYSQL_PASSWORD: devmentor123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build: ./backened
    container_name: project_backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/devmentor
      SPRING_DATASOURCE_USERNAME: devmentor
      SPRING_DATASOURCE_PASSWORD: devmentor123
      JWT_SECRET: local-dev-secret-at-least-32-characters-long
      JWT_EXPIRATION: 86400000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:80,http://localhost
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: Strict
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      AGORA_APP_ID: ${AGORA_APP_ID:-}
      AGORA_APP_CERTIFICATE: ${AGORA_APP_CERTIFICATE:-}
      AGORA_RTM_APP_ID: ${AGORA_RTM_APP_ID:-}
      AGORA_RTM_APP_CERTIFICATE: ${AGORA_RTM_APP_CERTIFICATE:-}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  # React Frontend
  frontend:
    build:
      context: ./frontened
      args:
        REACT_APP_API_URL: http://localhost:8080/api
        REACT_APP_RAZORPAY_KEY_ID: ${REACT_APP_RAZORPAY_KEY_ID:-}
        REACT_APP_AGORA_APP_ID: ${REACT_APP_AGORA_APP_ID:-}
    container_name: project_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
